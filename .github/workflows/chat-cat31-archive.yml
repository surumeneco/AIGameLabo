name: Chat isolated CAT31 snapshot transfer
on:
  push:
    branches:
      - infra/cat31-readonly-snapshot-20261117
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed public CAT-TDD commit
        uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 53df9ee22dfcab7c637268f18c056026442637e2
          persist-credentials: false
      - name: Verify exact repository identity and package tracked files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "53df9ee22dfcab7c637268f18c056026442637e2"
          test "$(git rev-parse HEAD^{tree})" = "970d6463427d02be216eee23705d6ccfcee095f3"
          mkdir -p transport
          git archive --format=tar HEAD | gzip -n > transport/cat31-source.tar.gz
          printf 'surumeneco/CAT-TDD\n%s\n%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > transport/source-identity.txt
          (cd transport && sha256sum cat31-source.tar.gz source-identity.txt > SHA256SUMS)
      - name: Upload read-only source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cat31-53df9ee-snapshot
          path: transport/
          if-no-files-found: error
          retention-days: 1
