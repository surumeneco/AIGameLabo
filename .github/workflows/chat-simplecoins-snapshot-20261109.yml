name: Chat isolated SimpleCoins source snapshot
on:
  push:
    branches:
      - infra/chat-simplecoins-snapshot-20261109
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned product source
        uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: a888c888aa986e418c6e455497ea51eec4a16973
          persist-credentials: false
      - name: Archive pinned source read only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a888c888aa986e418c6e455497ea51eec4a16973'
          git archive --format=tar HEAD -o /tmp/simplecoins-source.tar
          sha256sum /tmp/simplecoins-source.tar
          printf '%s\n' 'surumeneco/SimpleCoins' > /tmp/repository.txt
          printf '%s\n' 'a888c888aa986e418c6e455497ea51eec4a16973' > /tmp/commit.txt
          printf '%s\n' 'a4c0e39a3caba3ba8b4bc4ac4306ecfba9ba178e' > /tmp/tree.txt
      - name: Stage pinned JUnit 5 runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --output /tmp/junit-platform-console-standalone-1.11.4.jar https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar
          test "$(stat -c %s /tmp/junit-platform-console-standalone-1.11.4.jar)" -gt 1000000
          sha256sum /tmp/junit-platform-console-standalone-1.11.4.jar
      - name: Upload immutable project snapshot
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-chat-snapshot-a888c888
          path: |
            /tmp/simplecoins-source.tar
            /tmp/junit-platform-console-standalone-1.11.4.jar
            /tmp/repository.txt
            /tmp/commit.txt
            /tmp/tree.txt
          if-no-files-found: error
          retention-days: 1
