name: Isolated Paper 26.2 actual SimpleCoins bootstrap smoke
on:
  push:
    branches:
      - infra/chat-simplecoins-paper-lifecycle-probe-20261109
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout immutable SimpleCoins bootstrap feature commit
        uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: 04a18ff730e9dd788c370ca34cb71c3d10200e78
          persist-credentials: false
      - name: Verify immutable tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "04a18ff730e9dd788c370ca34cb71c3d10200e78"
          test "$(git rev-parse HEAD^{tree})" = "8690cb5de38669ccfefd8d8e9ed1856ae2ecfbde"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build real plugin and test-only companion checker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/test/java/co/surumene/simplecoins/spike
          cat > src/test/java/co/surumene/simplecoins/spike/PaperAdmissionHostProbe.java <<'JAVA'
          package co.surumene.simplecoins.spike;

          import io.papermc.paper.event.connection.PlayerConnectionValidateLoginEvent;
          import org.bukkit.Bukkit;
          import org.bukkit.plugin.RegisteredListener;
          import org.bukkit.plugin.java.JavaPlugin;

          /** External observation fixture, NEVER included in SimpleCoins JAR. */
          public final class PaperAdmissionHostProbe extends JavaPlugin {
              @Override public void onEnable() {
                  getServer().getScheduler().runTaskLater(this, () -> {
                      try {
                          var target = getServer().getPluginManager().getPlugin("SimpleCoins");
                          if (target == null || !target.isEnabled())
                              throw new IllegalStateException("SimpleCoins is not enabled");
                          var event = new PlayerConnectionValidateLoginEvent(null, null);
                          int count = 0;
                          for (RegisteredListener listener :
                                  PlayerConnectionValidateLoginEvent.getHandlerList().getRegisteredListeners()) {
                              if (listener.getPlugin() != target) continue;
                              listener.callEvent(event);
                              count++;
                          }
                          if (count != 1 || event.isAllowed() || event.getKickMessage() == null)
                              throw new IllegalStateException("Join was not default denied: count=" + count);
                          if (!Bukkit.getOnlinePlayers().isEmpty())
                              throw new IllegalStateException("Probe requires 0 players");
                          getLogger().info("HOST_PROBE_DEFAULT_DENY_CONFIRMED");
                          getLogger().info("HOST_PROBE_DISABLE_TARGET");
                          getServer().getPluginManager().disablePlugin(target);
                      } catch (Throwable e) {
                          getLogger().severe("HOST_PROBE_FAILED " + e);
                          Bukkit.shutdown();
                      }
                  }, 5L);
              }
          }
          JAVA
          gradle --no-daemon clean test jar
          mkdir -p /tmp/simplecoins-paper-actual/plugins /tmp/simplecoins-paper-actual/host
          cp build/libs/SimpleCoins-1.0.0.jar /tmp/simplecoins-paper-actual/plugins/SimpleCoins.jar
          cat > /tmp/simplecoins-paper-actual/host/plugin.yml <<'YAML'
          name: SimpleCoinsHostProbe
          version: 0.0.0-technical
          main: co.surumene.simplecoins.spike.PaperAdmissionHostProbe
          api-version: '26.2'
          load: POSTWORLD
          depend:
            - SimpleCoins
          YAML
          jar --create --file /tmp/simplecoins-paper-actual/plugins/SimpleCoinsHostProbe.jar -C build/classes/java/test co/surumene/simplecoins/spike/PaperAdmissionHostProbe.class -C /tmp/simplecoins-paper-actual/host plugin.yml
          jar --list --file /tmp/simplecoins-paper-actual/plugins/SimpleCoins.jar | grep -E '^(plugin.yml|co/surumene/simplecoins/SimpleCoinsPlugin.class)$'
      - name: Retrieve official Paper 26.2 stable build 134
        shell: bash
        run: |
          set -euo pipefail
          builds="$(curl --fail --silent --show-error --location --retry 3 https://fill.papermc.io/v3/projects/paper/versions/26.2/builds)"
          url="$(echo "$builds" | jq -r '.[] | select(.id == 134 and .channel == "STABLE") | .downloads."server:default".url' | head -1)"
          digest="$(echo "$builds" | jq -r '.[] | select(.id == 134 and .channel == "STABLE") | .downloads."server:default".checksums.sha256' | head -1)"
          test -n "$url" && test "$url" != "null"
          test -n "$digest" && test "$digest" != "null"
          curl --fail --silent --show-error --location --retry 3 "$url" --output /tmp/simplecoins-paper-actual/paper.jar
          (cd /tmp/simplecoins-paper-actual && echo "$digest  paper.jar" | sha256sum --check -)
          echo "HOST_PROBE_PAPER_SHA256=$digest"
      - name: Boot real plugin on Paper and verify denial/disable/shutdown
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/simplecoins-paper-actual
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25569\nview-distance=2\nsimulation-distance=2\nmax-players=1\n' > server.properties
          set +e
          timeout --signal=TERM 150s java -Xms384M -Xmx1536M -jar paper.jar --nogui > server.log 2>&1
          rc="$?"
          set -e
          tail -n 130 server.log
          echo "HOST_PROBE_EXIT_CODE=$rc"
          test "$rc" -eq 0
          grep -q 'Settlement engine not connected; player admission remains disabled.' server.log
          grep -q 'HOST_PROBE_DEFAULT_DENY_CONFIRMED' server.log
          grep -q 'HOST_PROBE_DISABLE_TARGET' server.log
          grep -q 'SimpleCoins admission protection disabled: stopping Paper.' server.log
          grep -q 'Stopping server' server.log
          grep -q 'Saving worlds' server.log
      - name: Upload actual Paper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-real-bootstrap-paper26.2-log
          path: /tmp/simplecoins-paper-actual/server.log
          if-no-files-found: warn
          retention-days: 7
