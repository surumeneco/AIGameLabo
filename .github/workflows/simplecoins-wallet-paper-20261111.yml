          grep -q 'INTEGRATION_PAPER_LIVE_SOURCE_CAPTURE_PASSED worlds=2 distinct=1100' server.log
          grep -q 'INTEGRATION_PAPER_HYBRID_PENDING_PASSED amount=1100 missing-owner-rejected' server.log
          grep -q 'INTEGRATION_DURABLE_JOURNAL_LOCK_PASSED head=0' server.log
          grep -q 'INTEGRATION_RECIPE_COUNT_PASSED count=20' server.log
          grep -q 'INTEGRATION_RECIPE_PREDICATES_PASSED count=20' server.log
          grep -q 'INTEGRATION_TRADER_DEFAULTS_PASSED weights=256..1 chance=0.1' server.log
          grep -q 'INTEGRATION_WALLET_PDC_PASSED' server.log
          grep -q 'INTEGRATION_SAVED_ITEM_PDC_PARITY_PASSED count=9 wallet=640000' server.log
          grep -q 'INTEGRATION_PAPER_LIVE_VALUATION_PASSED count=9 inventory=640300' server.log
          grep -q 'INTEGRATION_WALLET_UUID_DUPLICATE_REJECTED' server.log
          grep -q 'INTEGRATION_LOADED_CHUNK_ASSETS_PASSED block=300 item=50' server.log
          grep -q 'INTEGRATION_LOADED_WORLD_WALLET_IDENTITY_PASSED' server.log
          grep -q 'INTEGRATION_LIVE_DISPLAY_PASSED amount=1000 duplicate-wallet-rejected' server.log
          grep -q 'INTEGRATION_LIVE_EQUIPMENT_PASSED amount=700 duplicate-wallet-rejected' server.log
          grep -q 'INTEGRATION_LIVE_PLAYER_ADAPTER_READY_EMPTY_SOURCE' server.log
          grep -q 'INTEGRATION_LIVE_INVENTORY_ENTITY_PASSED amount=80 duplicate-wallet-rejected' server.log
          grep -q 'INTEGRATION_LIVE_VILLAGER_INVENTORY_PASSED amount=200 duplicate-wallet-rejected' server.log
          grep -q 'INTEGRATION_WALLET_EMPTY_BUNDLE_GUARD_PASSED' server.log
          grep -q 'INTEGRATION_WALLET_STACK_CAP_GUARD_PASSED' server.log
          grep -q 'INTEGRATION_WALLET_RECIPES_PASSED count=17' server.log
          grep -q 'INTEGRATION_WALLET_LISTENERS_PASSED count=4' server.log
          grep -q 'INTEGRATION_WALLET_CANCEL_PRESERVATION_PASSED' server.log
          grep -q 'Stopping server' server.log
          grep -q 'Saving worlds' server.log
          echo 'INTEGRATION_PAPER_26_2_BOOT_SUCCESS'
      - name: Reject corrupt durable journal at real Paper startup
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sc-integration
          head=plugins/SimpleCoins/normal-mutations/head
          test -f "$head"
          # Simulate damage to the durable accounting state between restarts.
          printf 'malformed-checksummed-head' > "$head"
          set +e
          (sleep 24; echo stop) | timeout --signal=TERM 80s java -Xms384M -Xmx1536M -jar paper.jar --nogui > server-corrupt.log 2>&1
          rc="$?"
          set -e
          tail -n 75 server-corrupt.log
          test "$rc" -ne 124
          grep -q 'Cannot initialize durable normal monetary journal' server-corrupt.log
          grep -q 'Failed to register admission protection' server-corrupt.log
          grep -q 'Stopping server' server-corrupt.log
          if grep -q 'INTEGRATION_DURABLE_JOURNAL_LOCK_PASSED' server-corrupt.log; then
            echo 'Probe should never enable against corrupted journal' >&2
            exit 1
          fi
          echo 'INTEGRATION_CORRUPT_JOURNAL_FAIL_CLOSED_PASSED'
      - name: Upload Paper probe and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-guard-coin-paper
          path: |
            /tmp/sc-integration/server.log
            /tmp/sc-integration/server-corrupt.log
            /tmp/sc-integration/plugins/
            build/test-results/test/
            admission-guard/build/test-results/test/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-guard-coin-exact-source
          path: |
            /tmp/sc-integration/exact-source.tar.gz
            /tmp/sc-integration/tree.txt
            /tmp/sc-integration/source.sha256
          retention-days: 7
          if-no-files-found: warn
