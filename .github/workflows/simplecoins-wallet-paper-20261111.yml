name: Isolated SimpleCoins integrated-safety Paper 26.2 verification
on:
  push:
    branches:
      - infra/chat-simplecoins-integrated-safe-20261112
permissions:
  contents: read
jobs:
  integrated-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Checkout immutable SimpleCoins integration candidate
        uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: 28597acf8256b84f922426383c775a14ae1b11c8
          persist-credentials: false
      - name: Verify exact HEAD and archive full source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "28597acf8256b84f922426383c775a14ae1b11c8"
          mkdir -p /tmp/sc-integration
          git archive --format=tar HEAD | gzip -n > /tmp/sc-integration/exact-source.tar.gz
          git rev-parse HEAD^{tree} > /tmp/sc-integration/tree.txt
          sha256sum /tmp/sc-integration/exact-source.tar.gz > /tmp/sc-integration/source.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and test both production plugin projects
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test jar :admission-guard:jar
          test -s build/libs/SimpleCoins-1.0.0.jar
          test -s admission-guard/build/libs/admission-guard-1.0.0.jar
          mkdir -p /tmp/sc-integration/plugins
          cp build/libs/SimpleCoins-1.0.0.jar /tmp/sc-integration/plugins/SimpleCoins.jar
          cp admission-guard/build/libs/admission-guard-1.0.0.jar /tmp/sc-integration/plugins/SimpleCoinsGuard.jar
      - name: Compile actual Paper integration smoke probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/test/java/co/surumene/simplecoins/integration /tmp/sc-probe-desc
          cat > src/test/java/co/surumene/simplecoins/integration/RuntimeProbe.java <<'JAVA'
          package co.surumene.simplecoins.integration;
          import co.surumene.simplecoins.guard.api.AdmissionPermit;
          import org.bukkit.Bukkit;
          import org.bukkit.NamespacedKey;
          import org.bukkit.Keyed;
          import org.bukkit.plugin.java.JavaPlugin;
          import co.surumene.simplecoins.paper.WalletItemCodec;
          import co.surumene.simplecoins.paper.WalletMenu;
          import co.surumene.simplecoins.paper.CoinItemCodec;
          import co.surumene.simplecoins.domain.CoinDenomination;
          import co.surumene.simplecoins.domain.StoredItemValue;
          import co.surumene.simplecoins.domain.NbtReader;
          import java.io.ByteArrayInputStream;
          import java.math.BigInteger;
          import org.bukkit.inventory.meta.BundleMeta;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.inventory.InventoryClickEvent;
          import org.bukkit.event.HandlerList;
          import org.bukkit.Material;
          import org.bukkit.inventory.ItemStack;
          import java.util.UUID;

          public final class RuntimeProbe extends JavaPlugin {
              @Override public void onEnable() {
                  getServer().getScheduler().runTaskLater(this, this::check, 10L);
              }
              private void check() {
                  try {
                      var main = getServer().getPluginManager().getPlugin("SimpleCoins");
                      var guard = getServer().getPluginManager().getPlugin("SimpleCoinsGuard");
                      if (main == null || !main.isEnabled() || guard == null || !guard.isEnabled())
                          throw new AssertionError("main and independent guard both must be enabled");
                      var provider = getServer().getServicesManager().getRegistration(AdmissionPermit.class);
                      if (provider == null || provider.getProvider().mayAdmit())
                          throw new AssertionError("unverified accounting must never grant admission");
                      getLogger().info("INTEGRATION_ADMISSION_CLOSED_PASSED");
                      int count = 0;
                      var it = Bukkit.recipeIterator();
                      while (it.hasNext()) {
                          var recipe = it.next();
                          if (recipe instanceof Keyed keyed && keyed.getKey().getNamespace().equals("simplecoins")
                                  && keyed.getKey().getKey().startsWith("exchange_"))
                              count++;
                      }
                      if (count != 20) throw new AssertionError("expected 20 recipes, found " + count);
                      getLogger().info("INTEGRATION_RECIPE_COUNT_PASSED count=" + count);
                      var config = main.getConfig();
                      if (!config.getBoolean("trader-drops.enabled") || config.getDouble("trader-drops.chance") != 0.5)
                          throw new AssertionError("approved default drop probability not loaded");
                      int[] faces = {1,5,10,50,100,500,1000,5000,10000};
                      int expected = 256;
                      for (int face : faces) {
                          if (config.getInt("trader-drops.weights." + face) != expected)
                              throw new AssertionError("invalid default denomination weight " + face);
                          expected /= 2;
                      }
                      getLogger().info("INTEGRATION_TRADER_DEFAULTS_PASSED weights=256..1 chance=0.5");
                      var codec = new WalletItemCodec(() ->
                          UUID.fromString("00000000-0000-0000-0000-000000000123"), "C");
                      ItemStack wallet = codec.create();
                      var original = codec.read(wallet).orElseThrow();
                      if (wallet.getAmount() != 1 || original.balance() != 0
                              || wallet.getMaxStackSize() != 1)
                          throw new AssertionError("new wallet invalid");
                      ItemStack loaded = ItemStack.deserializeBytes(wallet.serializeAsBytes());
                      if (!codec.read(loaded).orElseThrow().equals(original))
                          throw new AssertionError("wallet PDC lost on item serialize/deserialize");
                      ItemStack credited = codec.withBalance(wallet, 640000L);
                      var updated = codec.read(credited).orElseThrow();
                      if (!updated.id().equals(original.id()) || updated.balance() != 640000L
                              || codec.read(wallet).orElseThrow().balance() != 0)
                          throw new AssertionError("wallet PDC edit mutated identity or original");
                      ItemStack colored = codec.recolor(credited, Material.RED_BUNDLE);
                      if (colored.getType() != Material.RED_BUNDLE
                              || !codec.read(colored).orElseThrow().equals(updated))
                          throw new AssertionError("wallet recolor changed UUID or money");
                      if (codec.balance(colored).withdraw(10000L).amount() != 630000L)
                          throw new AssertionError("wallet draw failed");
                      boolean rejected = false;
                      try { codec.balance(colored).deposit(1L, 500000L); }
                      catch (IllegalStateException expectedException) { rejected = true; }
                      if (!rejected) throw new AssertionError("reduced cap accepted deposit");
                      getLogger().info("INTEGRATION_WALLET_PDC_PASSED");
                      // Prove the saved-value reader accepts *actual* Paper ItemStack
                      // serialization, not only hand-authored PDC/NBT test maps.
                      var physicalCoins = new CoinItemCodec(CoinItemCodec.defaultNames());
                      for (int face : faces) {
                          ItemStack stack = physicalCoins.create(CoinDenomination.fromValue(face), 3);
                          var serialized = stack.serializeAsBytes();
                          var nbt = NbtReader.read(new ByteArrayInputStream(serialized), 1048576);
                          BigInteger observed = StoredItemValue.value(nbt);
                          if (!observed.equals(BigInteger.valueOf((long) face * 3L)))
                              throw new AssertionError("Saved coin mismatch: " + face + " expected="
                                  + (face * 3L) + " actual=" + observed);
                      }
                      ItemStack balanceWallet = codec.withBalance(codec.create(), 640000L);
                      var savedWallet = NbtReader.read(
                          new ByteArrayInputStream(balanceWallet.serializeAsBytes()), 1048576);
                      if (!StoredItemValue.value(savedWallet).equals(BigInteger.valueOf(640000L)))
                          throw new AssertionError("Saved wallet PDC balance mismatch");
                      ItemStack counterfeit = physicalCoins.create(CoinDenomination.HUNDRED, 1);
                      var counterfeitMeta = counterfeit.getItemMeta();
                      counterfeitMeta.setItemModel(new NamespacedKey("simplecoins", "coin_500"));
                      counterfeit.setItemMeta(counterfeitMeta);
                      var badSaved = NbtReader.read(
                          new ByteArrayInputStream(counterfeit.serializeAsBytes()), 1048576);
                      boolean invalidSavedRejected = false;
                      try { StoredItemValue.value(badSaved); }
                      catch (java.io.IOException malformed) { invalidSavedRejected = true; }
                      if (!invalidSavedRejected)
                          throw new AssertionError("Corrupt Paper item_model bypassed saved-value guard");
                      getLogger().info("INTEGRATION_SAVED_ITEM_PDC_PARITY_PASSED count=9 wallet=640000");
                      ItemStack hidden = colored.clone();
                      var bundleMeta = (BundleMeta) hidden.getItemMeta();
                      bundleMeta.addItem(new ItemStack(Material.DIRT, 1));
                      hidden.setItemMeta(bundleMeta);
                      if (!codec.hasWalletMarker(hidden))
                          throw new AssertionError("the PDC mutation fixture lost its marker");
                      boolean refusedContents = false;
                      try { codec.read(hidden); }
                      catch (IllegalStateException invalidContents) { refusedContents = true; }
                      if (!refusedContents)
                          throw new AssertionError("wallet accepted hidden native Bundle contents");
                      refusedContents = false;
                      try { codec.withBalance(hidden, 1); }
                      catch (IllegalStateException invalidContents) { refusedContents = true; }
                      if (!refusedContents)
                          throw new AssertionError("wallet balance edit accepted hidden contents");
                      refusedContents = false;
                      try { codec.recolor(hidden, Material.BLUE_BUNDLE); }
                      catch (IllegalStateException invalidContents) { refusedContents = true; }
                      if (!refusedContents)
                          throw new AssertionError("wallet recolor accepted hidden contents");
                      if (!codec.read(colored).orElseThrow().equals(updated))
                          throw new AssertionError("safe wallet changed due to corrupted fixture");
                      getLogger().info("INTEGRATION_WALLET_EMPTY_BUNDLE_GUARD_PASSED");
                      ItemStack overstackable = colored.clone();
                      var modifiable = overstackable.getItemMeta();
                      modifiable.setMaxStackSize(64);
                      overstackable.setItemMeta(modifiable);
                      if (!codec.hasWalletMarker(overstackable)
                              || overstackable.getMaxStackSize() != 64)
                          throw new AssertionError("max-stack fixture did not produce a stackable wallet");
                      boolean rejectsStack = false;
                      try { codec.read(overstackable); }
                      catch (IllegalStateException invalidCap) { rejectsStack = true; }
                      if (!rejectsStack)
                          throw new AssertionError("wallet accepted stackable duplicate UUID");
                      rejectsStack = false;
                      try { codec.withBalance(overstackable, 1L); }
                      catch (IllegalStateException invalidCap) { rejectsStack = true; }
                      if (!rejectsStack)
                          throw new AssertionError("balance update accepted stackable wallet");
                      getLogger().info("INTEGRATION_WALLET_STACK_CAP_GUARD_PASSED");
                      int wallets = 0;
                      int dyes = 0;
                      var recipes = Bukkit.recipeIterator();
                      while (recipes.hasNext()) {
                          var recipe = recipes.next();
                          if (recipe instanceof Keyed keyed
                                  && keyed.getKey().getNamespace().equals("simplecoins")) {
                              if (keyed.getKey().getKey().equals("wallet")) wallets++;
                              if (keyed.getKey().getKey().startsWith("wallet_dye_")) dyes++;
                          }
                      }
                      if (wallets != 1 || dyes != 16)
                          throw new AssertionError("wallet recipes unavailable " + wallets + "/" + dyes);
                      getLogger().info("INTEGRATION_WALLET_RECIPES_PASSED count=" + (wallets + dyes));
                      int walletHandlers = 0;
                      for (var handlerList : HandlerList.getHandlerLists()) {
                          for (var registration : handlerList.getRegisteredListeners()) {
                              if (registration.getPlugin().equals(main)
                                      && registration.getListener().getClass().getName().equals(
                                          "co.surumene.simplecoins.paper.WalletMenu"))
                                  walletHandlers++;
                          }
                      }
                      if (walletHandlers != 4)
                          throw new AssertionError("unexpected wallet listener count: " + walletHandlers);
                      getLogger().info("INTEGRATION_WALLET_LISTENERS_PASSED count=" + walletHandlers);
                      EventHandler click = WalletMenu.class
                          .getDeclaredMethod("onClick", InventoryClickEvent.class)
                          .getAnnotation(EventHandler.class);
                      if (click == null || !click.ignoreCancelled())
                          throw new AssertionError("WalletMenu may un-cancel protected inventory clicks");
                      getLogger().info("INTEGRATION_WALLET_CANCEL_PRESERVATION_PASSED");
                  } catch (Throwable failure) {
                      getLogger().severe("INTEGRATION_PROBE_FAILED " + failure);
                  }
              }
          }
          JAVA
          cat > /tmp/sc-probe-desc/plugin.yml <<'YAML'
          name: SimpleCoinsRuntimeProbe
          version: 0.0.1
          main: co.surumene.simplecoins.integration.RuntimeProbe
          api-version: '26.2'
          load: POSTWORLD
          depend:
            - SimpleCoinsGuard
            - SimpleCoins
          YAML
          gradle --no-daemon testClasses
          jar --create --file /tmp/sc-integration/plugins/RuntimeProbe.jar -C build/classes/java/test co/surumene/simplecoins/integration/RuntimeProbe.class -C /tmp/sc-probe-desc plugin.yml
      - name: Download verified official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          builds="$(curl --fail --silent --show-error --location --retry 3 https://fill.papermc.io/v3/projects/paper/versions/26.2/builds)"
          url="$(echo "$builds" | jq -r '.[] | select(.id == 134 and .channel == "STABLE") | .downloads."server:default".url' | head -1)"
          sha="$(echo "$builds" | jq -r '.[] | select(.id == 134 and .channel == "STABLE") | .downloads."server:default".checksums.sha256' | head -1)"
          test -n "$url" && test "$url" != "null"
          test -n "$sha" && test "$sha" != "null"
          curl --fail --silent --show-error --location --retry 3 "$url" --output /tmp/sc-integration/paper.jar
          (cd /tmp/sc-integration && echo "$sha  paper.jar" | sha256sum --check -)
      - name: Boot both real plugin JARs and probe live Paper registration
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sc-integration
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25570\nview-distance=2\nsimulation-distance=2\nmax-players=1\n' > server.properties
          set +e
          (sleep 55; echo stop) | timeout --signal=TERM 150s java -Xms384M -Xmx1536M -jar paper.jar --nogui > server.log 2>&1
          rc="$?"
          set -e
          tail -n 100 server.log
          test "$rc" -eq 0
          if grep -q 'INTEGRATION_PROBE_FAILED' server.log; then exit 1; fi
          if grep -q 'Error occurred while enabling' server.log; then exit 1; fi
          grep -q 'INTEGRATION_ADMISSION_CLOSED_PASSED' server.log
          grep -q 'INTEGRATION_RECIPE_COUNT_PASSED count=20' server.log
          grep -q 'INTEGRATION_TRADER_DEFAULTS_PASSED weights=256..1 chance=0.5' server.log
          grep -q 'INTEGRATION_WALLET_PDC_PASSED' server.log
          grep -q 'INTEGRATION_SAVED_ITEM_PDC_PARITY_PASSED count=9 wallet=640000' server.log
          grep -q 'INTEGRATION_WALLET_EMPTY_BUNDLE_GUARD_PASSED' server.log
          grep -q 'INTEGRATION_WALLET_STACK_CAP_GUARD_PASSED' server.log
          grep -q 'INTEGRATION_WALLET_RECIPES_PASSED count=17' server.log
          grep -q 'INTEGRATION_WALLET_LISTENERS_PASSED count=4' server.log
          grep -q 'INTEGRATION_WALLET_CANCEL_PRESERVATION_PASSED' server.log
          grep -q 'Stopping server' server.log
          grep -q 'Saving worlds' server.log
          echo 'INTEGRATION_PAPER_26_2_BOOT_SUCCESS'
      - name: Upload Paper probe and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-guard-coin-paper
          path: |
            /tmp/sc-integration/server.log
            /tmp/sc-integration/plugins/
            build/test-results/test/
            admission-guard/build/test-results/test/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-guard-coin-exact-source
          path: |
            /tmp/sc-integration/exact-source.tar.gz
            /tmp/sc-integration/tree.txt
            /tmp/sc-integration/source.sha256
          retention-days: 7
          if-no-files-found: warn
