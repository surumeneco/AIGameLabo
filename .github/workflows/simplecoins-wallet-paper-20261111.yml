name: SimpleCoins full Paper to pending hybrid accounting composition 26.2
on:
  push:
    branches:
      - infra/chat-simplecoins-paper-hybrid-compose-paper-20261112
permissions:
  contents: read
jobs:
  integrated-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Checkout immutable SimpleCoins integration candidate
        uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: 88d7467826cd1105928e6a95e7fad358fb28ffbe
          persist-credentials: false
      - name: Verify exact HEAD and archive full source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "88d7467826cd1105928e6a95e7fad358fb28ffbe"
          mkdir -p /tmp/sc-integration
          git archive --format=tar HEAD | gzip -n > /tmp/sc-integration/exact-source.tar.gz
          git rev-parse HEAD^{tree} > /tmp/sc-integration/tree.txt
          sha256sum /tmp/sc-integration/exact-source.tar.gz > /tmp/sc-integration/source.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and test both production plugin projects
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test jar :admission-guard:jar
          test -s build/libs/SimpleCoins-1.0.0.jar
          test -s admission-guard/build/libs/admission-guard-1.0.0.jar
          mkdir -p /tmp/sc-integration/plugins
          cp build/libs/SimpleCoins-1.0.0.jar /tmp/sc-integration/plugins/SimpleCoins.jar
          cp admission-guard/build/libs/admission-guard-1.0.0.jar /tmp/sc-integration/plugins/SimpleCoinsGuard.jar
      - name: Compile actual Paper integration smoke probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/test/java/co/surumene/simplecoins/integration /tmp/sc-probe-desc
          cat > src/test/java/co/surumene/simplecoins/integration/RuntimeProbe.java <<'JAVA'
          package co.surumene.simplecoins.integration;
          import co.surumene.simplecoins.guard.api.AdmissionPermit;
          import org.bukkit.Bukkit;
          import org.bukkit.NamespacedKey;
          import org.bukkit.Keyed;
          import org.bukkit.plugin.java.JavaPlugin;
          import co.surumene.simplecoins.paper.WalletItemCodec;
          import co.surumene.simplecoins.paper.WalletMenu;
          import co.surumene.simplecoins.paper.PaperLiveItemValue;
          import co.surumene.simplecoins.paper.PaperLoadedChunkAssets;
          import co.surumene.simplecoins.paper.PaperLoadedWorldAssets;
          import co.surumene.simplecoins.paper.PaperLivePlayerAssets;
          import co.surumene.simplecoins.paper.PaperLiveUniverseAssets;
          import co.surumene.simplecoins.paper.PaperHybridSettlementComposer;
          import co.surumene.simplecoins.domain.WorldStorageDiscovery;
          import co.surumene.simplecoins.domain.WorldScope;
          import co.surumene.simplecoins.domain.SettlementAccumulator;
          import org.bukkit.Location;
          import org.bukkit.block.Chest;
          import org.bukkit.inventory.Inventory;
          import co.surumene.simplecoins.paper.CoinItemCodec;
          import co.surumene.simplecoins.domain.CoinDenomination;
          import co.surumene.simplecoins.domain.CoinExchangeFormula;
          import co.surumene.simplecoins.domain.NormalMutationJournal;
          import co.surumene.simplecoins.domain.HybridLiveSourceStage;
          import co.surumene.simplecoins.domain.DurableFile;
          import java.nio.ByteBuffer;
          import java.nio.file.Files;
          import java.io.IOException;
          import co.surumene.simplecoins.domain.StoredItemValue;
          import org.bukkit.inventory.RecipeChoice;
          import org.bukkit.inventory.ShapelessRecipe;
          import java.util.EnumMap;
          import co.surumene.simplecoins.domain.NbtReader;
          import java.io.ByteArrayInputStream;
          import java.math.BigInteger;
          import org.bukkit.inventory.meta.BundleMeta;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.inventory.InventoryClickEvent;
          import org.bukkit.event.HandlerList;
          import org.bukkit.Material;
          import org.bukkit.inventory.ItemStack;
          import java.util.UUID;

          public final class RuntimeProbe extends JavaPlugin {
              private static java.util.Map<String, Object> parseSerialized(ItemStack item)
                      throws java.io.IOException {
                  byte[] bytes = item.serializeAsBytes();
                  if (bytes.length < 2) throw new java.io.IOException("Truncated Paper item serialization");
                  java.io.InputStream raw = new ByteArrayInputStream(bytes);
                  // Paper's ItemStack serialization may be GZIP-framed NBT.
                  java.io.InputStream decoded = ((bytes[0] & 255) == 0x1f
                          && (bytes[1] & 255) == 0x8b)
                      ? new java.util.zip.GZIPInputStream(raw) : raw;
                  try (decoded) {
                      return NbtReader.read(decoded, 1048576);
                  }
              }
              @Override public void onEnable() {
                  getServer().getScheduler().runTaskLater(this, this::check, 10L);
              }
              private void check() {
                  try {
                      var main = getServer().getPluginManager().getPlugin("SimpleCoins");
                      var guard = getServer().getPluginManager().getPlugin("SimpleCoinsGuard");
                      if (main == null || !main.isEnabled() || guard == null || !guard.isEnabled())
                          throw new AssertionError("main and independent guard both must be enabled");
                      var provider = getServer().getServicesManager().getRegistration(AdmissionPermit.class);
                      if (provider == null || provider.getProvider().mayAdmit())
                          throw new AssertionError("unverified accounting must never grant admission");
                      getLogger().info("INTEGRATION_ADMISSION_CLOSED_PASSED");
                      var journalPath = main.getDataFolder().toPath().resolve("normal-mutations");
                      var headPath = journalPath.resolve("head");
                      if (!Files.isRegularFile(headPath))
                          throw new AssertionError("Durable startup journal head missing");
                      byte[] persistedHead = DurableFile.read(headPath, 8);
                      if (persistedHead.length != 8 || ByteBuffer.wrap(persistedHead).getLong() != 0)
                          throw new AssertionError("New journal head is not sequence zero");
                      boolean exclusive = false;
                      try (var unexpected = new NormalMutationJournal(journalPath)) {
                          // A second writer here would be a severe currency-integrity defect.
                      } catch (IOException expectedLocked) {
                          exclusive = true;
                      }
                      if (!exclusive) throw new AssertionError("Journal single-writer lock not held");
                      getLogger().info("INTEGRATION_DURABLE_JOURNAL_LOCK_PASSED head=0");
                      int count = 0;
                      var it = Bukkit.recipeIterator();
                      while (it.hasNext()) {
                          var recipe = it.next();
                          if (recipe instanceof Keyed keyed && keyed.getKey().getNamespace().equals("simplecoins")
                                  && keyed.getKey().getKey().startsWith("exchange_"))
                              count++;
                      }
                      if (count != 20) throw new AssertionError("expected 20 recipes, found " + count);
                      getLogger().info("INTEGRATION_RECIPE_COUNT_PASSED count=" + count);
                      // Verify all registered real recipe choices, not merely that keys exist.
                      var fullCodec = new CoinItemCodec(CoinItemCodec.defaultNames());
                      int validated = 0;
                      for (CoinExchangeFormula formula : CoinExchangeFormula.all()) {
                          var key = new NamespacedKey(main, "exchange_" + formula.id());
                          var resolved = Bukkit.getRecipe(key);
                          if (!(resolved instanceof ShapelessRecipe shapeless))
                              throw new AssertionError("Missing shapeless registered exchange: " + key);
                          if (shapeless.getChoiceList().size() != formula.inputCount())
                              throw new AssertionError("Wrong ingredient count: " + key);
                          var expectedCoin = fullCodec.create(formula.input(), 1);
                          var reconfiguredNames = new EnumMap<CoinDenomination, String>(CoinDenomination.class);
                          reconfiguredNames.putAll(CoinItemCodec.defaultNames());
                          reconfiguredNames.put(formula.input(), "Renamed " + formula.input().value());
                          var renamedCoin = new CoinItemCodec(reconfiguredNames).create(formula.input(), 1);
                          var invalidCoin = expectedCoin.clone();
                          var invalidMeta = invalidCoin.getItemMeta();
                          invalidMeta.setItemModel(new NamespacedKey("simplecoins", "coin_9999"));
                          invalidCoin.setItemMeta(invalidMeta);
                          for (RecipeChoice choice : shapeless.getChoiceList()) {
                              if (!choice.test(expectedCoin) || !choice.test(renamedCoin))
                                  throw new AssertionError("Genuine/renamed coin was rejected: " + key);
                              if (choice.test(new ItemStack(Material.PAPER, 1)) || choice.test(invalidCoin))
                                  throw new AssertionError("Normal or counterfeit paper accepted: " + key);
                          }
                          var output = shapeless.getResult();
                          if (fullCodec.identify(output).orElseThrow() != formula.output()
                                  || output.getAmount() != formula.outputCount()
                                  || formula.totalValue() != (long) formula.outputCount()
                                      * formula.output().value())
                              throw new AssertionError("Exchange loses or duplicates value: " + key);
                          validated++;
                      }
                      if (validated != 20) throw new AssertionError("Exchange matrix incomplete");
                      getLogger().info("INTEGRATION_RECIPE_PREDICATES_PASSED count=" + validated);
                      var config = main.getConfig();
                      if (!config.getBoolean("trader-drops.enabled") || config.getDouble("trader-drops.chance") != 0.1)
                          throw new AssertionError("approved default drop probability not loaded");
                      int[] faces = {1,5,10,50,100,500,1000,5000,10000};
                      int expected = 256;
                      for (int face : faces) {
                          if (config.getInt("trader-drops.weights." + face) != expected)
                              throw new AssertionError("invalid default denomination weight " + face);
                          expected /= 2;
                      }
                      getLogger().info("INTEGRATION_TRADER_DEFAULTS_PASSED weights=256..1 chance=0.1");
                      var codec = new WalletItemCodec(() ->
                          UUID.fromString("00000000-0000-0000-0000-000000000123"), "C");
                      ItemStack wallet = codec.create();
                      var original = codec.read(wallet).orElseThrow();
                      if (wallet.getAmount() != 1 || original.balance() != 0
                              || wallet.getMaxStackSize() != 1)
                          throw new AssertionError("new wallet invalid");
                      ItemStack loaded = ItemStack.deserializeBytes(wallet.serializeAsBytes());
                      if (!codec.read(loaded).orElseThrow().equals(original))
                          throw new AssertionError("wallet PDC lost on item serialize/deserialize");
                      ItemStack credited = codec.withBalance(wallet, 640000L);
                      var updated = codec.read(credited).orElseThrow();
                      if (!updated.id().equals(original.id()) || updated.balance() != 640000L
                              || codec.read(wallet).orElseThrow().balance() != 0)
                          throw new AssertionError("wallet PDC edit mutated identity or original");
                      ItemStack colored = codec.recolor(credited, Material.RED_BUNDLE);
                      if (colored.getType() != Material.RED_BUNDLE
                              || !codec.read(colored).orElseThrow().equals(updated))
                          throw new AssertionError("wallet recolor changed UUID or money");
                      if (codec.balance(colored).withdraw(10000L).amount() != 630000L)
                          throw new AssertionError("wallet draw failed");
                      boolean rejected = false;
                      try { codec.balance(colored).deposit(1L, 500000L); }
                      catch (IllegalStateException expectedException) { rejected = true; }
                      if (!rejected) throw new AssertionError("reduced cap accepted deposit");
                      getLogger().info("INTEGRATION_WALLET_PDC_PASSED");
                      // Prove the saved-value reader accepts *actual* Paper ItemStack
                      // serialization, not only hand-authored PDC/NBT test maps.
                      var physicalCoins = new CoinItemCodec(CoinItemCodec.defaultNames());
                      // Cross-world physical clone detection in a fresh source
                      // generation, before other smoke fixtures mutate chests.
                      if (Bukkit.getWorlds().size() < 2)
                          throw new AssertionError("Two real Paper worlds required");
                      // Use two new isolated worlds: earlier smoke probes in
                      // the default world intentionally create cloned-wallet
                      // fixtures, and Bukkit tile snapshots may survive their
                      // same-tick restoration. Those are unrelated to this test.
                      var firstWorld = java.util.Objects.requireNonNull(
                          Bukkit.createWorld(new org.bukkit.WorldCreator("sc_universe_a")
                              .type(org.bukkit.WorldType.FLAT).generateStructures(false)));
                      var secondWorld = java.util.Objects.requireNonNull(
                          Bukkit.createWorld(new org.bukkit.WorldCreator("sc_universe_b")
                              .type(org.bukkit.WorldType.FLAT).generateStructures(false)));
                      var firstChunk = firstWorld.getChunkAt(
                          firstWorld.getSpawnLocation().getChunk().getX() + 16,
                          firstWorld.getSpawnLocation().getChunk().getZ() + 16);
                      var secondChunkUniverse = secondWorld.getChunkAt(
                          secondWorld.getSpawnLocation().getChunk().getX() + 16,
                          secondWorld.getSpawnLocation().getChunk().getZ() + 16);
                      int ux = firstChunk.getX() * 16 + 4;
                      int uz = firstChunk.getZ() * 16 + 4;
                      int uy = Math.min(firstWorld.getMaxHeight() - 2,
                          Math.max(firstWorld.getMinHeight() + 2,
                              firstWorld.getHighestBlockYAt(ux, uz) + 2));
                      int wx = secondChunkUniverse.getX() * 16 + 4;
                      int wz = secondChunkUniverse.getZ() * 16 + 4;
                      int wy = Math.min(secondWorld.getMaxHeight() - 2,
                          Math.max(secondWorld.getMinHeight() + 2,
                              secondWorld.getHighestBlockYAt(wx, wz) + 2));
                      var firstBlockUniverse = firstWorld.getBlockAt(ux, uy, uz);
                      var secondBlockUniverse = secondWorld.getBlockAt(wx, wy, wz);
                      Material firstOldType = firstBlockUniverse.getType();
                      Material secondOldType = secondBlockUniverse.getType();
                      var liveBudget = new PaperLiveUniverseAssets.Budget(
                          2, 10000, 100000, 100000, 1000000, 1, 1048576, 1048576);
                      try {
                          firstBlockUniverse.setType(Material.CHEST);
                          secondBlockUniverse.setType(Material.CHEST);
                          ItemStack clonedAcrossWorlds = codec.withBalance(codec.create(), 800L);
                          ((Chest) firstBlockUniverse.getState()).getBlockInventory()
                              .setItem(0, clonedAcrossWorlds);
                          ((Chest) secondBlockUniverse.getState()).getBlockInventory()
                              .setItem(0, clonedAcrossWorlds.clone());
                          boolean rejectedAcrossWorlds = false;
                          try {
                              PaperLiveUniverseAssets.scan(
                                  java.util.List.of(firstWorld, secondWorld), liveBudget);
                          } catch (IOException crossWorldDuplicate) {
                              rejectedAcrossWorlds = crossWorldDuplicate.getMessage() != null
                                  && crossWorldDuplicate.getMessage().contains("Duplicate physical wallet UUID");
                              if (!rejectedAcrossWorlds) throw crossWorldDuplicate;
                          }
                          if (!rejectedAcrossWorlds)
                              throw new AssertionError("Two-world cloned wallet was counted");
                          var differentWalletCodec = new WalletItemCodec(UUID::randomUUID, "C");
                          ((Chest) secondBlockUniverse.getState()).getBlockInventory()
                              .setItem(0, differentWalletCodec.withBalance(
                                  differentWalletCodec.create(), 300L));
                          var sharedGeneration = new java.util.HashSet<UUID>();
                          var universe = PaperLiveUniverseAssets.scan(
                              java.util.List.of(firstWorld, secondWorld), liveBudget,
                              sharedGeneration);
                          if (universe.worlds().size() != 2
                              || universe.online().scannedPlayers() != 0
                              || universe.total().compareTo(BigInteger.valueOf(1100L)) < 0
                              || universe.isCompleteSettlementSource())
                              throw new AssertionError("Distinct cross-world wallets were lost");
                          var paperWalletIdentities = new java.util.HashSet<UUID>();
                          var detail = PaperLiveUniverseAssets.scanWithSources(
                              java.util.List.of(firstWorld, secondWorld), liveBudget,
                              paperWalletIdentities);
                          if (detail.sources().size() != detail.report().scannedChunks()
                                  + detail.report().online().scannedPlayers()
                              || !detail.report().total().equals(universe.total()))
                              throw new AssertionError("Per-source value and coverage differ");
                          boolean firstSource = false, secondSource = false;
                          for (var source : detail.sources()) {
                              if (source instanceof HybridLiveSourceStage.ChunkSource sourceChunk) {
                                  if (sourceChunk.chunk().world().equals(firstWorld.getName())
                                      && sourceChunk.values().stream().anyMatch(value ->
                                          value.amount().equals(BigInteger.valueOf(800L))))
                                      firstSource = true;
                                  if (sourceChunk.chunk().world().equals(secondWorld.getName())
                                      && sourceChunk.values().stream().anyMatch(value ->
                                          value.amount().equals(BigInteger.valueOf(300L))))
                                      secondSource = true;
                              }
                          }
                          if (!firstSource || !secondSource ||
                              detail.isCompleteSettlementSource())
                              throw new AssertionError("Physical Chunk source provenance lost");
                          getLogger().info("INTEGRATION_PAPER_LIVE_SOURCE_CAPTURE_PASSED worlds=2 distinct=1100");
                          // End-to-end read-only composition: read-once Paper
                          // physical sources -> exact LIVE closure -> saved-NBT
                          // staging (empty here) -> authoritative owner
                          // classification -> the SAME pending accumulator.
                          var hybrid = PaperHybridSettlementComposer.compose(
                              detail, new WorldStorageDiscovery.Manifest(
                                  java.util.List.of(), java.util.Map.of()),
                              new WorldScope(true, java.util.Set.of(), java.util.Set.of()),
                              java.util.Set.of(),
                              (world, position) -> null,
                              (world, savedChunk) -> java.util.Map.of(),
                              (holder, physical) -> new SettlementAccumulator.Asset(
                                  holder.id(), physical.physicalKey(), physical.world(),
                                  null, false, false, true, physical.amount(),
                                  "live/" + holder.id() + "/" + physical.physicalKey()),
                              1048576, 1048576, paperWalletIdentities);
                          var hybridResult = hybrid.pending().commit();
                          if (!hybridResult.free().equals(detail.report().total())
                              || !hybridResult.personalBalances().isEmpty()
                              || hybrid.requiredSourceIds().size() != detail.sources().size())
                              throw new AssertionError("Physical Paper assets were not staged completely");
                          boolean unknownOwnerRejected = false;
                          try {
                              PaperHybridSettlementComposer.compose(
                                  detail, new WorldStorageDiscovery.Manifest(
                                      java.util.List.of(), java.util.Map.of()),
                                  new WorldScope(true, java.util.Set.of(), java.util.Set.of()),
                                  java.util.Set.of(), (world, position) -> null,
                                  (world, savedChunk) -> java.util.Map.of(),
                                  (holder, physical) -> null,
                                  1048576, 1048576, new java.util.HashSet<UUID>());
                          } catch (IOException missingOwner) {
                              unknownOwnerRejected = missingOwner.getMessage() != null
                                  && missingOwner.getMessage().contains(
                                      "Missing authoritative LIVE asset classification");
                              if (!unknownOwnerRejected) throw missingOwner;
                          }
                          if (!unknownOwnerRejected)
                              throw new AssertionError("No-ownership source was accepted");
                          getLogger().info("INTEGRATION_PAPER_HYBRID_PENDING_PASSED amount="
                              + hybridResult.free() + " missing-owner-rejected");

                          // Serialized Paper wallet is the saved NBT value
                          // which an offline playerdata reader would visit.
                          // A shared identity context must reject it in either
                          // source order, even if each independently parses.
                          boolean rejectSavedAfterLive = false;
                          try {
                              StoredItemValue.value(parseSerialized(clonedAcrossWorlds),
                                  sharedGeneration);
                          } catch (IOException duplicateSavedWallet) {
                              rejectSavedAfterLive = duplicateSavedWallet.getMessage() != null
                                  && duplicateSavedWallet.getMessage().contains(
                                      "Duplicate physical wallet UUID");
                              if (!rejectSavedAfterLive) throw duplicateSavedWallet;
                          }
                          if (!rejectSavedAfterLive)
                              throw new AssertionError("Saved wallet duplicate after live was accepted");
                          var savedFirstGeneration = new java.util.HashSet<UUID>();
                          StoredItemValue.value(parseSerialized(clonedAcrossWorlds),
                              savedFirstGeneration);
                          boolean rejectLiveAfterSaved = false;
                          try {
                              PaperLiveUniverseAssets.scan(
                                  java.util.List.of(firstWorld, secondWorld), liveBudget,
                                  savedFirstGeneration);
                          } catch (IOException duplicateLiveWallet) {
                              rejectLiveAfterSaved = duplicateLiveWallet.getMessage() != null
                                  && duplicateLiveWallet.getMessage().contains(
                                      "Duplicate physical wallet UUID");
                              if (!rejectLiveAfterSaved) throw duplicateLiveWallet;
                          }
                          if (!rejectLiveAfterSaved)
                              throw new AssertionError("Live wallet duplicate after saved was accepted");
                          getLogger().info("INTEGRATION_CROSS_SAVED_LIVE_WALLET_PASSED both-orders-rejected");
                          boolean worldAliasRejected = false;
                          try {
                              PaperLiveUniverseAssets.scan(
                                  java.util.List.of(firstWorld, firstWorld), liveBudget);
                          } catch (IOException alias) { worldAliasRejected = true; }
                          if (!worldAliasRejected)
                              throw new AssertionError("Duplicate selected World was accepted");
                          getLogger().info("INTEGRATION_LIVE_UNIVERSE_PASSED worlds=2 cloned-rejected distinct=1100");
                      } finally {
                          firstBlockUniverse.setType(firstOldType);
                          secondBlockUniverse.setType(secondOldType);
                      }
                      for (int face : faces) {
                          ItemStack stack = physicalCoins.create(CoinDenomination.fromValue(face), 3);
                          var nbt = parseSerialized(stack);
                          if (face == 100) getLogger().info("PAPER_COIN_NBT_ROOT_KEYS " + nbt.keySet());
                          BigInteger observed = StoredItemValue.value(nbt);
                          if (!observed.equals(BigInteger.valueOf((long) face * 3L)))
                              throw new AssertionError("Saved coin mismatch: " + face + " expected="
                                  + (face * 3L) + " actual=" + observed);
                      }
                      ItemStack balanceWallet = codec.withBalance(codec.create(), 640000L);
                      var savedWallet = parseSerialized(balanceWallet);
                      if (!StoredItemValue.value(savedWallet).equals(BigInteger.valueOf(640000L)))
                          throw new AssertionError("Saved wallet PDC balance mismatch");
                      ItemStack counterfeit = physicalCoins.create(CoinDenomination.HUNDRED, 1);
                      var counterfeitMeta = counterfeit.getItemMeta();
                      counterfeitMeta.setItemModel(new NamespacedKey("simplecoins", "coin_500"));
                      counterfeit.setItemMeta(counterfeitMeta);
                      var badSaved = parseSerialized(counterfeit);
                      boolean invalidSavedRejected = false;
                      try { StoredItemValue.value(badSaved); }
                      catch (java.io.IOException malformed) { invalidSavedRejected = true; }
                      if (!invalidSavedRejected)
                          throw new AssertionError("Corrupt Paper item_model bypassed saved-value guard");
                      getLogger().info("INTEGRATION_SAVED_ITEM_PDC_PARITY_PASSED count=9 wallet=640000");
                      for (int face : faces) {
                          var actualLiveCoin = physicalCoins.create(CoinDenomination.fromValue(face), 3);
                          if (!PaperLiveItemValue.stack(actualLiveCoin, 1048576, 1048576)
                                  .equals(BigInteger.valueOf(face * 3L)))
                              throw new AssertionError("Live item valuation differs from saved: " + face);
                      }
                      if (!PaperLiveItemValue.stack(balanceWallet, 1048576, 1048576)
                              .equals(BigInteger.valueOf(640000L)))
                          throw new AssertionError("Live wallet balance missing");
                      if (!PaperLiveItemValue.stack(null, 1048576, 1048576).equals(BigInteger.ZERO)
                              || !PaperLiveItemValue.stack(new ItemStack(Material.PAPER), 1048576, 1048576)
                                      .equals(BigInteger.ZERO))
                          throw new AssertionError("Plain or empty live item gained monetary value");
                      Inventory inventory = Bukkit.createInventory(null, 18);
                      inventory.setItem(0, physicalCoins.create(CoinDenomination.HUNDRED, 3));
                      inventory.setItem(1, balanceWallet);
                      inventory.setItem(2, new ItemStack(Material.PAPER));
                      if (!PaperLiveItemValue.inventory(inventory, 18, 1048576, 1048576)
                              .equals(BigInteger.valueOf(640300L)))
                          throw new AssertionError("Live inventory sum was not 640300");
                      boolean rejectedLive = false;
                      try { PaperLiveItemValue.stack(counterfeit, 1048576, 1048576); }
                      catch (IOException expectedCorrupt) { rejectedLive = true; }
                      if (!rejectedLive) throw new AssertionError("Live counterfeit must fail closed");
                      rejectedLive = false;
                      try { PaperLiveItemValue.inventory(inventory, 9, 1048576, 1048576); }
                      catch (IOException expectedBudget) { rejectedLive = true; }
                      if (!rejectedLive) throw new AssertionError("Inventory budget not enforced");
                      rejectedLive = false;
                      try { PaperLiveItemValue.stack(physicalCoins.create(CoinDenomination.ONE, 1), 1, 1048576); }
                      catch (IOException expectedBudget) { rejectedLive = true; }
                      if (!rejectedLive) throw new AssertionError("NBT byte budget not enforced");
                      getLogger().info("INTEGRATION_PAPER_LIVE_VALUATION_PASSED count=9 inventory=640300");
                      // A cloned wallet UUID in a second slot is not two assets.
                      inventory.setItem(3, balanceWallet.clone());
                      boolean duplicateRejected = false;
                      try { PaperLiveItemValue.inventory(inventory, 18, 1048576, 1048576); }
                      catch (IOException duplicate) { duplicateRejected = true; }
                      if (!duplicateRejected)
                          throw new AssertionError("Cloned wallet identity double counted");
                      inventory.setItem(3, null);
                      if (!PaperLiveItemValue.inventory(inventory, 18, 1048576, 1048576)
                              .equals(BigInteger.valueOf(640300L)))
                          throw new AssertionError("Value did not recover when cloned wallet was removed");
                      getLogger().info("INTEGRATION_WALLET_UUID_DUPLICATE_REJECTED");
                      // Real loaded world: one chest's physical block inventory and
                      // a dropped Item Entity; never count the 54-slot double chest
                      // alias or consider this partial result an entire settlement.
                      var liveWorld = Bukkit.getWorlds().getFirst();
                      var spawnChunk = liveWorld.getSpawnLocation().getChunk();
                      int lx = spawnChunk.getX() * 16 + 4;
                      int lz = spawnChunk.getZ() * 16 + 4;
                      int ly = Math.min(liveWorld.getMaxHeight() - 2,
