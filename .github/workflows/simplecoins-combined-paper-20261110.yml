name: SimpleCoins combined Paper 26.2 integration smoke
on:
  push:
    branches:
      - infra/simplecoins-paper-integration-smoke-20261110
permissions:
  contents: read
jobs:
  paper-real-server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact combined SimpleCoins candidate
        uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: 9b1906ac7a9b83997d0168258bef0efb4c07fb80
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b1906ac7a9b83997d0168258bef0efb4c07fb80"
          test "$(git rev-parse HEAD^{tree})" = "9f8ee96e75f9fec5172ae1a82b80b939d64af9c2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Add isolated hosted integration verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/test/java/smoke /tmp/simplecoins-smoke/verification /tmp/simplecoins-smoke/plugins
          cat > src/test/java/smoke/HostedVerification.java <<'JAVA'
          package smoke;
          import io.papermc.paper.event.connection.PlayerConnectionValidateLoginEvent;
          import net.kyori.adventure.text.Component;
          import org.bukkit.Bukkit;
          import org.bukkit.plugin.RegisteredListener;
          import org.bukkit.plugin.Plugin;
          import org.bukkit.plugin.java.JavaPlugin;
          public final class HostedVerification extends JavaPlugin {
              @Override public void onEnable() {
                  Bukkit.getScheduler().runTaskLater(this, () -> {
                      try {
                          Plugin simple = Bukkit.getPluginManager().getPlugin("SimpleCoins");
                          if (simple == null || !simple.isEnabled())
                              throw new IllegalStateException("SimpleCoins missing or disabled");
                          var event = new PlayerConnectionValidateLoginEvent(null, null);
                          int handlers = 0;
                          for (RegisteredListener listener :
                                  PlayerConnectionValidateLoginEvent.getHandlerList().getRegisteredListeners()) {
                              if (listener.getPlugin() != simple) continue;
                              listener.callEvent(event);
                              handlers++;
                          }
                          if (handlers != 1 || event.isAllowed() || event.getKickMessage() == null)
                              throw new IllegalStateException("Default-deny not active; handlers=" + handlers);
                          var previous = Component.text("Existing ban");
                          var previouslyDenied = new PlayerConnectionValidateLoginEvent(null, previous);
                          for (RegisteredListener listener :
                                  PlayerConnectionValidateLoginEvent.getHandlerList().getRegisteredListeners())
                              if (listener.getPlugin() == simple) listener.callEvent(previouslyDenied);
                          if (previouslyDenied.isAllowed() || !previous.equals(previouslyDenied.getKickMessage()))
                              throw new IllegalStateException("Earlier rejection was overwritten");
                          if (!Bukkit.getOnlinePlayers().isEmpty())
                              throw new IllegalStateException("Expected zero online players");
                          getLogger().info("COMBINED_BOOTSTRAP_DEFAULT_DENY_AND_PRIOR_BAN_OK");
                          Bukkit.getPluginManager().disablePlugin(simple);
                          getLogger().info("COMBINED_DISABLE_REQUEST_SENT");
                      } catch (Throwable failure) {
                          getLogger().severe("COMBINED_SMOKE_FAILED: " + failure);
                          Bukkit.shutdown();
                      }
                  }, 5L);
              }
          }
          JAVA
          cat > /tmp/simplecoins-smoke/verification/plugin.yml <<'YAML'
          name: AdmissionHostProbe
          version: 0.0.0-smoke
          main: smoke.HostedVerification
          api-version: '26.2'
          load: POSTWORLD
          depend:
            - SimpleCoins
          YAML
      - name: Compile test host and real candidate jar
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test jar
          candidate="$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$candidate"
          cp "$candidate" /tmp/simplecoins-smoke/plugins/SimpleCoins.jar
          jar --list --file /tmp/simplecoins-smoke/plugins/SimpleCoins.jar | grep -Fx 'plugin.yml'
          jar --list --file /tmp/simplecoins-smoke/plugins/SimpleCoins.jar | grep -Fx 'co/surumene/simplecoins/SimpleCoinsPlugin.class'
          jar --create --file /tmp/simplecoins-smoke/plugins/AdmissionHostProbe.jar \
            -C build/classes/java/test smoke/HostedVerification.class \
            -C /tmp/simplecoins-smoke/verification plugin.yml
          sha256sum /tmp/simplecoins-smoke/plugins/SimpleCoins.jar | tee /tmp/simplecoins-smoke/sha256.txt
      - name: Download checked official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          builds="$(curl --fail --silent --show-error --location --retry 3 https://fill.papermc.io/v3/projects/paper/versions/26.2/builds)"
          url="$(echo "$builds" | jq -r '.[] | select(.id == 134 and .channel == "STABLE") | .downloads."server:default".url' | head -1)"
          digest="$(echo "$builds" | jq -r '.[] | select(.id == 134 and .channel == "STABLE") | .downloads."server:default".checksums.sha256' | head -1)"
          test -n "$url" && test "$url" != "null"
          test -n "$digest" && test "$digest" != "null"
          curl --fail --silent --show-error --location --retry 3 "$url" -o /tmp/simplecoins-smoke/paper.jar
          (cd /tmp/simplecoins-smoke && echo "$digest  paper.jar" | sha256sum --check -)
          echo "PAPER_BUILD_134_SHA256=$digest"
      - name: Boot official Paper and enforce fail-closed on unconnected settlement
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/simplecoins-smoke
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25568\nview-distance=2\nsimulation-distance=2\nmax-players=1\nwhite-list=true\nenforce-whitelist=true\n' > server.properties
          printf '[]\n' > whitelist.json
          set +e
          timeout --signal=TERM 160s java -Xms384M -Xmx1536M -jar paper.jar --nogui > server.log 2>&1
          rc="$?"
          set -e
          tail -n 120 server.log
          echo "PAPER_EXIT_CODE=$rc"
          test "$rc" -eq 0
          ! grep -q 'COMBINED_SMOKE_FAILED' server.log
          grep -Fq 'COMBINED_BOOTSTRAP_DEFAULT_DENY_AND_PRIOR_BAN_OK' server.log
          grep -Fq 'COMBINED_DISABLE_REQUEST_SENT' server.log
          grep -Fq 'SimpleCoins admission protection disabled: stopping Paper.' server.log
          grep -Fq 'Stopping server' server.log
          grep -Fq 'Saving worlds' server.log
      - name: Upload candidate jar and evidence, test only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-combined-paper26.2-candidate-9b1906ac
          path: |
            /tmp/simplecoins-smoke/plugins/SimpleCoins.jar
            /tmp/simplecoins-smoke/sha256.txt
            /tmp/simplecoins-smoke/server.log
          if-no-files-found: warn
          retention-days: 7
