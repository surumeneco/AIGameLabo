name: SimpleCoins saved-source closure red/green
on:
  push:
    branches: ["infra/simplecoins-saved-closure-20261113-chat"]
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: 26515d83b1500b7e84114191447cb8e844d24384
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run exact SHA JUnit tests
        run: gradle --no-daemon clean test jar :admission-guard:jar
