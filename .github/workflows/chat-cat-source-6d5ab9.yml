name: CAT Chat source snapshot 6d5ab9
on:
  push:
    branches:
      - infra/chat-cat-snapshot-6d5ab9-20261108
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CAT source
        uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 6d5ab948c66442d8543dab65647ab361ddf819f1
          persist-credentials: false
      - name: Verify identity and create immutable tar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6d5ab948c66442d8543dab65647ab361ddf819f1"
          test "$(git rev-parse HEAD^{tree})" = "93f03bd089ea9e8e0ff08ed3f94bee0f48b88df0"
          test "$(git rev-parse HEAD:.cat-system)" = "a444b36dd494a65778a852af5c2dd7fc72f283fa"
          mkdir -p transfer
          git archive --format=tar.gz HEAD .cat-system > transfer/cat-tdd-fixed-6d5ab9.tar.gz
          sha256sum transfer/*.tar.gz > transfer/tar-sha256.txt
          printf 'commit=6d5ab948c66442d8543dab65647ab361ddf819f1\nroot_tree=93f03bd089ea9e8e0ff08ed3f94bee0f48b88df0\ncat_tree=a444b36dd494a65778a852af5c2dd7fc72f283fa\n' > transfer/source-identity.txt
      - name: Upload verified transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-tdd-source-6d5ab9
          path: transfer/
          if-no-files-found: error
          retention-days: 3
