name: CAT-TDD W10 read-only pinned snapshot
on:
  push:
    branches:
      - infra/cat-tdd-w10-snapshot-20261113
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact public CAT-TDD commit
        uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 7da04cab2cb47547319b45a3443640a7bdf94100
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Verify commit and archive exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "7da04cab2cb47547319b45a3443640a7bdf94100"
          test "$(git rev-parse HEAD^{tree})" = "b92dee6b7d044d53e973d7e8eac8b3dd221c67f0"
          git archive --format=tar HEAD | gzip -n > ../cat-tdd-w10-source.tar.gz
          cd ..
          sha256sum cat-tdd-w10-source.tar.gz > cat-tdd-w10-source.sha256
          printf 'repository=surumeneco/CAT-TDD\ncommit=7da04cab2cb47547319b45a3443640a7bdf94100\ntree=b92dee6b7d044d53e973d7e8eac8b3dd221c67f0\n' > cat-tdd-w10-source.manifest
      - name: Upload read-only snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cat-tdd-w10-source-7da04cab
          path: |
            cat-tdd-w10-source.tar.gz
            cat-tdd-w10-source.sha256
            cat-tdd-w10-source.manifest
          retention-days: 1
