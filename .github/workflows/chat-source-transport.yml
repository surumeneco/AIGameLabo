name: CAT-TDD Chat fixed source transfer
on:
  push:
    branches: [infra/chat-cat-source-bridge-20261105]
permissions:
  contents: read
jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 9dec8c01feb86a4cb4c7f897875de9cffcb34817
          path: pinned-cat
          persist-credentials: false
      - name: Verify immutable source and archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-cat rev-parse HEAD)" = "9dec8c01feb86a4cb4c7f897875de9cffcb34817"
          test -f pinned-cat/.cat-system/config/routing.json
          test -f pinned-cat/.cat-system/scripts/cat_flow.py
          tar -C pinned-cat -czf cat-tdd-fixed-9dec8c01.tar.gz .cat-system
          sha256sum cat-tdd-fixed-9dec8c01.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cat-tdd-chat-source-9dec8c01
          path: cat-tdd-fixed-9dec8c01.tar.gz
          if-no-files-found: error
          retention-days: 3
