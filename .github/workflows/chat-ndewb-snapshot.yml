name: Chat isolated NDEWB source snapshot
on:
  push:
    branches:
      - infra/chat-ndewb-snapshot-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch immutable public project commit
        run: |
          set -eu
          git clone --quiet https://github.com/surumeneco/NormalDespawnEndermanWithBlocks.git project
          git -C project checkout --quiet 104b82f76f119af0316603d28c73d578fbff5dfa
          test "$(git -C project rev-parse HEAD)" = "104b82f76f119af0316603d28c73d578fbff5dfa"
          test "$(git -C project rev-parse HEAD^{tree})" = "1cb873e73692b174f2978aa77cd8e2d256ac2fe5"
          mkdir -p output
          git -C project archive --format=tar.gz --output="$PWD/output/project-source.tar.gz" HEAD
          sha256sum output/project-source.tar.gz | tee output/sha256.txt
          printf '%s\n' 'repository=surumeneco/NormalDespawnEndermanWithBlocks' 'commit=104b82f76f119af0316603d28c73d578fbff5dfa' 'tree=1cb873e73692b174f2978aa77cd8e2d256ac2fe5' > output/identity.txt
      - name: Upload immutable source archive
        uses: actions/upload-artifact@v4
        with:
          name: ndewb-source-104b82
          path: output/
          if-no-files-found: error
