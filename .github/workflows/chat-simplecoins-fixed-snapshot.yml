name: Fixed SimpleCoins source snapshot
on:
  push:
    branches: ["infra/chat-simplecoins-snapshot-f15699d-20261124"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: f15699dc487e8c15a059e2081d0163eca29865ea
          persist-credentials: false
      - name: Verify identity and archive tracked source
        run: |
          test "$(git rev-parse HEAD)" = "f15699dc487e8c15a059e2081d0163eca29865ea"
          test "$(git rev-parse HEAD^{tree})" = "5b2193de46ea65f1098461c903b80b8e04d5113b"
          git archive --format=tar.gz HEAD > /tmp/project.tar.gz
          printf 'surumeneco/SimpleCoins\n%s\n%s\n' "f15699dc487e8c15a059e2081d0163eca29865ea" "5b2193de46ea65f1098461c903b80b8e04d5113b" > /tmp/identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: simplecoins-f15699d-source
          path: |
            /tmp/project.tar.gz
            /tmp/identity.txt
