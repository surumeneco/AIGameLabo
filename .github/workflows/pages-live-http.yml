name: Verify published Pages over HTTP
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Test and deploy prototypes']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  published-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests for HTTP verification
        run: node --test tests/pages-live-smoke.test.mjs
      - name: Verify live routes and assets
        run: node scripts/pages-live-smoke.mjs
