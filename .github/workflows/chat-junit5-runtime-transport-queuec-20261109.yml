name: Chat JUnit runtime transport queue-c 20261109
on:
  push:
    branches: [infra/chat-junit5-runtime-queuec-20261109]
permissions:
  contents: read
jobs:
  verified-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Maven Central JUnit console standalone and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base=https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4
          curl --fail --show-error --silent "$base/junit-platform-console-standalone-1.11.4.jar" -o junit-platform-console-standalone-1.11.4.jar
          curl --fail --show-error --silent "$base/junit-platform-console-standalone-1.11.4.jar.sha256" -o upstream.sha256
          expected="$(tr -d '\r\n[:space:]' < upstream.sha256)"
          actual="$(sha256sum junit-platform-console-standalone-1.11.4.jar | cut -d' ' -f1)"
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > verified-junit-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chat-junit5-standalone-1.11.4
          path: |
            junit-platform-console-standalone-1.11.4.jar
            verified-junit-sha256.txt
          retention-days: 1
          if-no-files-found: error
