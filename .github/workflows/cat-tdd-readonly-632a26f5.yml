name: CAT-TDD source snapshot 632a26f5
on:
  push:
    branches:
      - infra/cat-w06-w10-readonly-632a26f5-20261113
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch immutable CAT-TDD source
        run: |
          git clone --no-checkout https://github.com/surumeneco/CAT-TDD.git source
          cd source
          git fetch origin 632a26f55168624b8f9772bc8b1b7bbd4735f7cd
          git checkout --detach 632a26f55168624b8f9772bc8b1b7bbd4735f7cd
          test "$(git rev-parse HEAD)" = "632a26f55168624b8f9772bc8b1b7bbd4735f7cd"
          test "$(git rev-parse HEAD^{tree})" = "80b926120c4c10e6b23297c03a49d49a985ae42d"
          git archive --format=tar.gz -o ../cat-tdd-source.tar.gz HEAD
          cd ..
          sha256sum cat-tdd-source.tar.gz > cat-tdd-source.sha256
          printf '%s\n' '632a26f55168624b8f9772bc8b1b7bbd4735f7cd 80b926120c4c10e6b23297c03a49d49a985ae42d' > cat-tdd-source.manifest
      - uses: actions/upload-artifact@v4
        with:
          name: cat-tdd-source-632a26f5
          path: |
            cat-tdd-source.tar.gz
            cat-tdd-source.sha256
            cat-tdd-source.manifest
          retention-days: 1
