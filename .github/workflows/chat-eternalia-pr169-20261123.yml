name: Chat immutable Eternalia PR169 source snapshot
on:
  push:
    branches:
      - infra/chat-eternalia-pr169-20261123
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact immutable public source
        uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 4c78495b4212fe83c6341d999b1fa62dcfeb9a43
          persist-credentials: false
          fetch-depth: 1
      - name: Verify root Git tree and archive read-only source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4c78495b4212fe83c6341d999b1fa62dcfeb9a43'
          test "$(git rev-parse HEAD^{tree})" = '7f1c21ee458cd97357594a82c7ab9a7b73c7d3df'
          mkdir -p "${RUNNER_TEMP}/eternalia-snapshot"
          git archive --format=tar --output="${RUNNER_TEMP}/eternalia-snapshot/source.tar" HEAD
          printf '%s\n' 'surumeneco/Eternalia_Novel' '4c78495b4212fe83c6341d999b1fa62dcfeb9a43' '7f1c21ee458cd97357594a82c7ab9a7b73c7d3df' > "${RUNNER_TEMP}/eternalia-snapshot/identity.txt"
          (cd "${RUNNER_TEMP}/eternalia-snapshot" && sha256sum source.tar > source.tar.sha256)
      - name: Transfer immutable source bytes
        uses: actions/upload-artifact@v4
        with:
          name: eternalia-pr169-source-4c78495
          path: ${{ runner.temp }}/eternalia-snapshot/
          if-no-files-found: error
          retention-days: 1
