name: Read-only SimpleCoins f7eb source transfer
on:
  push:
    branches:
      - 'infra/chat-simplecoins-source-f7eb-20261108'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned public product commit without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: f7ebdc33227eb279d44461e9d7e6bf2d86598b23
          persist-credentials: false
          path: source
      - name: Verify exact identity and archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "f7ebdc33227eb279d44461e9d7e6bf2d86598b23"
          test "$(git -C source rev-parse HEAD^{tree})" = "5b8105ddae89ff95019321f8f91c648dd7ba37ec"
          mkdir -p transfer
          git -C source archive --format=tar HEAD | gzip -n > transfer/simplecoins-f7eb-source.tar.gz
          printf '%s\n' 'repository=surumeneco/SimpleCoins' 'commit=f7ebdc33227eb279d44461e9d7e6bf2d86598b23' 'tree=5b8105ddae89ff95019321f8f91c648dd7ba37ec' > transfer/source-manifest.txt
          sha256sum transfer/simplecoins-f7eb-source.tar.gz > transfer/archive.sha256
      - name: Upload immutable source transfer
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-source-f7eb
          path: transfer/
          if-no-files-found: error
          retention-days: 1
