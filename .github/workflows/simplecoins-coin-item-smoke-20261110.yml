name: Isolated SimpleCoins physical coin Paper 26.2 verification
on:
  push:
    branches:
      - infra/chat-simplecoins-coin-item-paper-20261110
permissions:
  contents: read
jobs:
  paper-coin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact SimpleCoins candidate
        uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: 8dc3a93d4bb2d2e486ca5a4740666ce8c1f75a37
          persist-credentials: false
      - name: Verify exact immutable product source
        run: test "$(git rev-parse HEAD)" = "8dc3a93d4bb2d2e486ca5a4740666ce8c1f75a37"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Archive exact product source for CAT host verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/coin-paper
          git archive --format=tar HEAD | gzip -n > /tmp/coin-paper/simplecoins-exact-source.tar.gz
          git rev-parse HEAD > /tmp/coin-paper/product-head.txt
          git rev-parse HEAD^{tree} > /tmp/coin-paper/product-tree.txt
          sha256sum /tmp/coin-paper/simplecoins-exact-source.tar.gz | tee /tmp/coin-paper/source-archive.sha256
      - name: Build source and run existing tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test jar
          test -s build/libs/SimpleCoins-1.0.0.jar
      - name: Build temporary runtime assertion plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/test/java/co/surumene/simplecoins/spike /tmp/coin-probe-descriptor /tmp/coin-paper/plugins
          cat > src/test/java/co/surumene/simplecoins/spike/CoinItemSmokeProbe.java <<'JAVA'
          package co.surumene.simplecoins.spike;

          import co.surumene.simplecoins.paper.CoinItemCodec;
          import co.surumene.simplecoins.domain.CoinDenomination;
          import co.surumene.simplecoins.domain.CoinExchangeFormula;
          import co.surumene.simplecoins.domain.PaperCurrencyConsumption;
          import co.surumene.simplecoins.paper.CoinExchangeRecipes;
          import co.surumene.simplecoins.paper.TraderCoinStackMaterializer;
          import co.surumene.simplecoins.paper.WanderingTraderDropConfigReader;
          import co.surumene.simplecoins.paper.TraderDeathIssuanceListener;
          import co.surumene.simplecoins.domain.TraderIssuanceJournal;
          import org.bukkit.damage.DamageSource;
          import org.bukkit.damage.DamageType;
          import org.bukkit.entity.EntityType;
          import org.bukkit.entity.WanderingTrader;
          import org.bukkit.configuration.file.YamlConfiguration;
          import co.surumene.simplecoins.domain.WanderingTraderDropPolicy;
          import org.bukkit.inventory.ShapelessRecipe;
          import org.bukkit.inventory.Recipe;
          import org.bukkit.Bukkit;
          import org.bukkit.Material;
          import org.bukkit.NamespacedKey;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.inventory.meta.ItemMeta;
          import org.bukkit.persistence.PersistentDataType;
          import org.bukkit.plugin.java.JavaPlugin;
          import net.kyori.adventure.text.Component;
          import java.util.EnumMap;

          public final class CoinItemSmokeProbe extends JavaPlugin {
              @Override public void onEnable() {
                  getServer().getScheduler().runTaskLater(this, this::verifyAndStop, 5L);
              }
              private void verifyAndStop() {
                  try {
                      var codec = new CoinItemCodec(CoinItemCodec.defaultNames());
                      int inspected = 0;
                      for (CoinDenomination d : CoinDenomination.values()) {
                          ItemStack one = codec.create(d, 1);
                          ItemStack full = codec.create(d, 64);
                          if (one.getType() != Material.PAPER || full.getAmount() != 64)
                              throw new AssertionError("wrong material or count " + d);
                          ItemMeta meta = one.getItemMeta();
                          if (meta == null
                                  || !Integer.valueOf(d.value()).equals(meta.getPersistentDataContainer().get(
                                      CoinItemCodec.DENOMINATION_KEY, PersistentDataType.INTEGER))
                                  || !CoinItemCodec.modelKey(d).equals(meta.getItemModel()))
                              throw new AssertionError("PDC/model invalid " + d);
                          if (codec.identify(one).orElseThrow() != d
                                  || codec.identify(full).orElseThrow() != d)
                              throw new AssertionError("round trip invalid " + d);
                          ItemStack renamed = one.clone();
                          ItemMeta renamedMeta = renamed.getItemMeta();
                          renamedMeta.displayName(Component.text("Alternate label " + d.value()));
                          renamed.setItemMeta(renamedMeta);
                          if (codec.identify(renamed).orElseThrow() != d)
                              throw new AssertionError("label changed value " + d);

                          ItemStack corruptModel = one.clone();
                          ItemMeta wrongModel = corruptModel.getItemMeta();
                          wrongModel.setItemModel(new NamespacedKey("simplecoins", "incorrect"));
                          corruptModel.setItemMeta(wrongModel);
                          expectReject(codec, corruptModel, "wrong model");

                          ItemStack corruptPdc = one.clone();
                          ItemMeta wrongPdc = corruptPdc.getItemMeta();
                          wrongPdc.getPersistentDataContainer().set(
                                  CoinItemCodec.DENOMINATION_KEY, PersistentDataType.INTEGER, 999);
                          corruptPdc.setItemMeta(wrongPdc);
                          expectReject(codec, corruptPdc, "invalid PDC");
                          inspected++;
                      }
                      if (inspected != 9 || codec.identify(new ItemStack(Material.PAPER)).isPresent())
                          throw new AssertionError("ordinary paper became coin");
                      var named = new EnumMap<>(CoinItemCodec.defaultNames());
                      named.put(CoinDenomination.ONE, "新しい通貨名");
                      if (new CoinItemCodec(named).identify(
                              codec.create(CoinDenomination.ONE, 1)).orElseThrow() != CoinDenomination.ONE)
                          throw new AssertionError("config names affected identity");
                      if (!codec.hasCoinMarker(codec.create(CoinDenomination.ONE, 1)))
                          throw new AssertionError("marker not recognizable");
                      try { codec.create(CoinDenomination.ONE, 65); throw new AssertionError("stack >64 allowed"); }
                      catch (IllegalArgumentException expected) { }
                      try { codec.create(CoinDenomination.ONE, 0); throw new AssertionError("stack 0 allowed"); }
                      catch (IllegalArgumentException expected) { }
                      getLogger().info("COIN_PAPER_NINE_DENOM_ROUNDTRIP_PASSED count=" + inspected);
                      var split = TraderCoinStackMaterializer.prepare(
                              new WanderingTraderDropPolicy.Drop(CoinDenomination.HUNDRED, 65), codec, 2);
                      if (split.size() != 2 || split.get(0).getAmount() != 64
                              || split.get(1).getAmount() != 1)
                          throw new AssertionError("trader stack split 65 failed");
                      long sumValue = 0;
                      for (ItemStack stack : split) {
                          if (codec.identify(stack).orElseThrow() != CoinDenomination.HUNDRED)
                              throw new AssertionError("wrong split denomination");
                          sumValue += (long) stack.getAmount() * 100L;
                      }
                      if (sumValue != 6500L) throw new AssertionError("trader split lost value");
                      try {
                          TraderCoinStackMaterializer.prepare(
                                  new WanderingTraderDropPolicy.Drop(CoinDenomination.HUNDRED, 65), codec, 1);
                          throw new AssertionError("insufficient stack budget accepted");
                      } catch (IllegalArgumentException expectedError) { }
                      try {
                          TraderCoinStackMaterializer.prepare(
                                  new WanderingTraderDropPolicy.Drop(CoinDenomination.HUNDRED, 65537), codec, 1024);
                          throw new AssertionError("oversized trader drop accepted");
                      } catch (IllegalArgumentException expectedError) { }
                      getLogger().info("COIN_TRADER_STACK_PREPARATION_PASSED count=2 value=" + sumValue);
                      var yaml = new YamlConfiguration();
                      yaml.set("trader-drops.enabled", true);
                      yaml.set("trader-drops.probability", 1.0);
                      yaml.set("trader-drops.min-count", 65);
                      yaml.set("trader-drops.max-count", 65);
                      yaml.set("trader-drops.max-stacks-per-event", 2);
                      yaml.set("trader-drops.weights.100", 1);
                      var loadedDrop = WanderingTraderDropConfigReader.read(yaml);
                      var selected = loadedDrop.policy().draw(new java.util.Random(3)).orElseThrow();
                      var fromConfig = TraderCoinStackMaterializer.prepare(
                              selected, codec, loadedDrop.maxStacksPerEvent());
                      if (selected.denomination() != CoinDenomination.HUNDRED
                              || selected.count() != 65 || fromConfig.size() != 2
                              || fromConfig.get(0).getAmount() != 64
                              || fromConfig.get(1).getAmount() != 1)
                          throw new AssertionError("trader config materialization mismatch");
                      getLogger().info("COIN_TRADER_CONFIG_PAPER_PASSED count=65 stacks=2");
                      var legacyConfig = new YamlConfiguration();
                      legacyConfig.set("trader-drops.enabled", true);
                      legacyConfig.set("trader-drops.chance", 1.0);
                      legacyConfig.set("trader-drops.minimum-count", 1);
                      legacyConfig.set("trader-drops.maximum-count", 1);
                      legacyConfig.set("trader-drops.weights.100", 1);
                      var legacy = WanderingTraderDropConfigReader.read(legacyConfig);
                      if (legacy.maxStacksPerEvent() != 1
                              || legacy.policy().draw(new java.util.Random(1))
                                  .orElseThrow().denomination() != CoinDenomination.HUNDRED)
                          throw new AssertionError("legacy candidate config failed");
                      legacyConfig.set("trader-drops.probability", 0.1);
                      try {
                          WanderingTraderDropConfigReader.read(legacyConfig);
                          throw new AssertionError("ambiguous trader config aliases accepted");
                      } catch (IllegalArgumentException expectedError) { }
                      getLogger().info("COIN_TRADER_CONFIG_LEGACY_ALIAS_PASSED");
                      var trader = (WanderingTrader) Bukkit.getWorlds().get(0).spawnEntity(
                              Bukkit.getWorlds().get(0).getSpawnLocation(), EntityType.WANDERING_TRADER);
                      var drops = new java.util.ArrayList<ItemStack>();
                      drops.add(new ItemStack(Material.PAPER, 2));
                      var death = new org.bukkit.event.entity.EntityDeathEvent(
                              trader, DamageSource.builder(DamageType.GENERIC).build(), drops, 0);
                      java.nio.file.Files.createDirectories(getDataFolder().toPath());
                      var journalPath = getDataFolder().toPath().resolve("trader-journal");
                      try (var journal = new TraderIssuanceJournal(journalPath)) {
                          var deathHandler = new TraderDeathIssuanceListener(loadedDrop, codec,
                                  journal, new java.util.Random(4),
                                  fail -> { throw new AssertionError("trader issuance fatal", fail); });
                          deathHandler.onDeath(death);
                          if (deathHandler.isHalted() || drops.size() != 3
                                  || drops.get(0).getType() != Material.PAPER
                                  || drops.get(1).getAmount() != 64 || drops.get(2).getAmount() != 1
                                  || codec.identify(drops.get(1)).orElseThrow() != CoinDenomination.HUNDRED
                                  || codec.identify(drops.get(2)).orElseThrow() != CoinDenomination.HUNDRED)
                              throw new AssertionError("trader event did not add exactly 65 coins");
                          deathHandler.onDeath(death);
                          if (drops.size() != 3 || journal.unresolved().size() != 1
                                  || journal.unresolved().get(0).value() != 6500L
                                  || journal.unresolved().get(0).status()
                                     != TraderIssuanceJournal.Status.EVENT_RECORDED)
                              throw new AssertionError("trader duplicate event minted twice");
                      }
                      try (var reopened = new TraderIssuanceJournal(journalPath)) {
                          if (!reopened.hasUnreconciledFromStartup())
                              throw new AssertionError("unreconciled receipt not quarantined");
                          try {
                              new TraderDeathIssuanceListener(loadedDrop, codec,
                                      reopened, new java.util.Random(4),
                                      fail -> { throw new AssertionError("unexpected journal callback", fail); });
                              throw new AssertionError("restart should refuse all new currency issues");
                          } catch (IllegalStateException expectedError) { }
                          if (drops.size() != 3 || reopened.unresolved().size() != 1)
                              throw new AssertionError("trader receipt did not survive reload");
                      }
                      var noDropJournalPath = getDataFolder().toPath().resolve("no-drop-journal");
                      try (var clean = new TraderIssuanceJournal(noDropJournalPath)) {
                          clean.begin(java.util.UUID.randomUUID(), java.util.Optional.empty());
                      }
                      try (var clean = new TraderIssuanceJournal(noDropJournalPath)) {
                          if (clean.hasUnreconciledFromStartup())
                              throw new AssertionError("no-drop receipt wrongly quarantined");
                          var resumed = new TraderDeathIssuanceListener(loadedDrop, codec,
                                  clean, new java.util.Random(4),
                                  fail -> { throw new AssertionError("no-drop startup callback", fail); });
                          if (resumed.isHalted()) throw new AssertionError("no-drop startup halted");
                      }
                      trader.remove();
                      getLogger().info("COIN_TRADER_DEATH_RECEIPT_PASSED stacks=2 value=6500 startup=quarantined");
                      if (!PaperCurrencyConsumption.blocksResult("MERCHANT", 2, true, false)
                              || !PaperCurrencyConsumption.blocksResult("CARTOGRAPHY", 2, false, true)
                              || PaperCurrencyConsumption.blocksResult("CARTOGRAPHY", 1, true, false)
                              || PaperCurrencyConsumption.blocksResult("MERCHANT", 2, false, false))
                          throw new AssertionError("paper result consumption guard broken");
                      getLogger().info("COIN_NONCRAFT_PAPER_GUARD_PASSED");
                      var exchange = new CoinExchangeRecipes(this, codec);
                      exchange.register();
                      if (exchange.registeredCount() != 20)
                          throw new AssertionError("registered " + exchange.registeredCount());
                      int verifiedRecipes = 0;
                      for (CoinExchangeFormula formula : CoinExchangeFormula.all()) {
                          var key = new NamespacedKey(this, "exchange_" + formula.id());
                          Recipe registered = Bukkit.getRecipe(key);
                          if (!(registered instanceof ShapelessRecipe shapeless))
                              throw new AssertionError("missing recipe " + key);
                          if (shapeless.getChoiceList().size() != formula.inputCount()
                                  || codec.identify(registered.getResult()).orElseThrow() != formula.output()
                                  || registered.getResult().getAmount() != formula.outputCount())
                              throw new AssertionError("wrong recipe payload " + key);
                          ItemStack[] matrix = new ItemStack[9];
                          for (int i = 0; i < formula.inputCount(); i++)
                              matrix[i] = codec.create(formula.input(), 1);
                          if (!exchange.isApproved(registered, matrix))
                              throw new AssertionError("valid source rejected " + key);
                          // Probe Paper's real native recipe resolver (not only
                          // our manually constructed registration bookkeeping).
                          Recipe resolved = Bukkit.getCraftingRecipe(
                                  matrix, Bukkit.getWorlds().get(0));
                          if (!(resolved instanceof org.bukkit.Keyed keyed)
                                  || !keyed.getKey().equals(key))
                              throw new AssertionError("Paper did not select exchange " + key
                                      + "; got " + resolved);
                          // Regression: pre-rename coins with the same PDC denomination
                          // must resolve through Paper's native recipe matcher.
                          ItemStack[] renamedMatrix = matrix.clone();
                          ItemStack renamedSource = renamedMatrix[0].clone();
                          ItemMeta renamedMeta = renamedSource.getItemMeta();
                          renamedMeta.displayName(Component.text("Legacy label " + formula.id()));
                          renamedSource.setItemMeta(renamedMeta);
                          renamedMatrix[0] = renamedSource;
                          if (!exchange.isApproved(registered, renamedMatrix))
                              throw new AssertionError("renamed source rejected " + key);
                          Recipe renamedResolved = Bukkit.getCraftingRecipe(
                                  renamedMatrix, Bukkit.getWorlds().get(0));
                          if (!(renamedResolved instanceof org.bukkit.Keyed renamedKeyed)
                                  || !renamedKeyed.getKey().equals(key))
                              throw new AssertionError("Paper rejected renamed source " + key
                                      + "; got " + renamedResolved);
                          ItemStack[] corruptMatrix = matrix.clone();
                          ItemStack corruptSource = corruptMatrix[0].clone();
                          ItemMeta corruptMeta = corruptSource.getItemMeta();
                          corruptMeta.setItemModel(new NamespacedKey("simplecoins", "wrong_model"));
                          corruptSource.setItemMeta(corruptMeta);
                          corruptMatrix[0] = corruptSource;
                          if (exchange.isApproved(registered, corruptMatrix))
                              throw new AssertionError("malformed coin accepted " + key);
                          Recipe corruptResolved = Bukkit.getCraftingRecipe(
                                  corruptMatrix, Bukkit.getWorlds().get(0));
                          if (corruptResolved instanceof org.bukkit.Keyed corruptKeyed
                                  && corruptKeyed.getKey().equals(key))
                              throw new AssertionError("Paper resolved malformed coin as exchange " + key);
                          ItemStack[] plain = matrix.clone();
                          plain[0] = new ItemStack(Material.PAPER);
                          if (exchange.isApproved(registered, plain))
                              throw new AssertionError("vanilla paper accepted " + key);
                          verifiedRecipes++;
                      }
                      if (verifiedRecipes != 20)
                          throw new AssertionError("incomplete recipe verification");
                      exchange.unregister();
                      getLogger().info("COIN_PAPER_TWENTY_RECIPES_REGISTERED_PASSED count=" + verifiedRecipes);
                  } catch (Throwable fail) {
                      getLogger().severe("COIN_PAPER_PROBE_FAILED " + fail);
                  } finally {
                      Bukkit.shutdown();
                  }
              }
              private static void expectReject(CoinItemCodec codec, ItemStack stack, String reason) {
                  try {
                      codec.identify(stack);
                      throw new AssertionError("accepted corrupt " + reason);
                  } catch (IllegalStateException ok) { }
              }
          }
          JAVA
          cat > /tmp/coin-probe-descriptor/plugin.yml <<'YAML'
          name: SimpleCoinsCoinItemProbe
          version: 0.0.1-test
          main: co.surumene.simplecoins.spike.CoinItemSmokeProbe
          api-version: '26.2'
          load: POSTWORLD
          YAML
          gradle --no-daemon testClasses
          jar --create --file /tmp/coin-paper/plugins/CoinItemProbe.jar -C build/classes/java/main co/surumene/simplecoins/paper/CoinItemCodec.class -C build/classes/java/main co/surumene/simplecoins/paper/CoinExchangeRecipes.class -C build/classes/java/main co/surumene/simplecoins/domain/CoinDenomination.class -C build/classes/java/main co/surumene/simplecoins/domain/CoinExchangeFormula.class -C build/classes/java/main co/surumene/simplecoins/domain/WanderingTraderDropPolicy.class -C build/classes/java/main 'co/surumene/simplecoins/domain/WanderingTraderDropPolicy$Drop.class' -C build/classes/java/main co/surumene/simplecoins/domain/TraderDropStackPlan.class -C build/classes/java/main co/surumene/simplecoins/paper/TraderCoinStackMaterializer.class -C build/classes/java/main co/surumene/simplecoins/paper/WanderingTraderDropConfigReader.class -C build/classes/java/main 'co/surumene/simplecoins/paper/WanderingTraderDropConfigReader$Loaded.class' -C build/classes/java/main co/surumene/simplecoins/paper/TraderDeathIssuanceListener.class -C build/classes/java/main co/surumene/simplecoins/domain/TraderIssuanceJournal.class -C build/classes/java/main 'co/surumene/simplecoins/domain/TraderIssuanceJournal$Receipt.class' -C build/classes/java/main 'co/surumene/simplecoins/domain/TraderIssuanceJournal$Status.class' -C build/classes/java/main co/surumene/simplecoins/domain/DurableFile.class -C build/classes/java/main co/surumene/simplecoins/domain/PaperCurrencyConsumption.class -C build/classes/java/test co/surumene/simplecoins/spike/CoinItemSmokeProbe.class -C /tmp/coin-probe-descriptor plugin.yml
          test -s /tmp/coin-paper/plugins/CoinItemProbe.jar
      - name: Fetch pinned official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          builds="$(curl --fail --silent --show-error --location --retry 3 https://fill.papermc.io/v3/projects/paper/versions/26.2/builds)"
          url="$(echo "$builds" | jq -r '.[] | select(.id == 134 and .channel == "STABLE") | .downloads."server:default".url' | head -1)"
          digest="$(echo "$builds" | jq -r '.[] | select(.id == 134 and .channel == "STABLE") | .downloads."server:default".checksums.sha256' | head -1)"
          test -n "$url" && test "$url" != "null"
          test -n "$digest" && test "$digest" != "null"
          curl --fail --silent --show-error --location --retry 3 "$url" --output /tmp/coin-paper/paper.jar
          (cd /tmp/coin-paper && echo "$digest  paper.jar" | sha256sum --check -)
          echo "COIN_PAPER_PINNED_SHA=$digest"
      - name: Start isolated Paper and validate live ItemStack PDC round trips
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/coin-paper
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25569\nview-distance=2\nsimulation-distance=2\nmax-players=1\n' > server.properties
          set +e
          timeout --signal=TERM 140s java -Xms384M -Xmx1536M -jar paper.jar --nogui > server.log 2>&1
          rc="$?"
          set -e
          tail -n 80 server.log
          test "$rc" -eq 0
          if grep -q 'COIN_PAPER_PROBE_FAILED' server.log; then exit 1; fi
          grep -q 'COIN_PAPER_NINE_DENOM_ROUNDTRIP_PASSED count=9' server.log
          grep -q 'COIN_TRADER_STACK_PREPARATION_PASSED count=2 value=6500' server.log
          grep -q 'COIN_TRADER_CONFIG_PAPER_PASSED count=65 stacks=2' server.log
          grep -q 'COIN_TRADER_CONFIG_LEGACY_ALIAS_PASSED' server.log
          grep -q 'COIN_TRADER_DEATH_RECEIPT_PASSED stacks=2 value=6500 startup=quarantined' server.log
          grep -q 'COIN_PAPER_TWENTY_RECIPES_REGISTERED_PASSED count=20' server.log
          grep -q 'COIN_NONCRAFT_PAPER_GUARD_PASSED' server.log
          grep -q 'Stopping server' server.log
          grep -q 'Saving worlds' server.log
          echo 'COIN_PAPER_26_2_INTEGRATION_SUCCESS'
      - name: Upload verification logs and isolated probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-coinitem-paper26.2
          path: |
            /tmp/coin-paper/server.log
            /tmp/coin-paper/plugins/CoinItemProbe.jar
          if-no-files-found: warn
          retention-days: 7
      - name: Upload immutable exact-source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecoins-exact-source
          path: |
            /tmp/coin-paper/simplecoins-exact-source.tar.gz
            /tmp/coin-paper/product-head.txt
            /tmp/coin-paper/product-tree.txt
            /tmp/coin-paper/source-archive.sha256
          if-no-files-found: error
          retention-days: 7
