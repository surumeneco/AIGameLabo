name: CAT20 final isolated CAT-TDD source snapshot
on:
  push:
    branches:
      - infra/cat20-source-snapshot-20261115
    paths:
      - .github/workflows/cat20-source-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: e98a152bdc1ae15990baf1db3fa5bb6618207929
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Verify git commit/tree and export
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "e98a152bdc1ae15990baf1db3fa5bb6618207929"
          test "$(git -C source rev-parse HEAD^{tree})" = "01bff4586a56733484a9868984b72f9143ad148b"
          mkdir -p bundle
          git -C source archive --format=tar HEAD | gzip -n > bundle/source.tar.gz
          sha256sum bundle/source.tar.gz | tee bundle/source.sha256
          printf '%s\n' '{"repository":"surumeneco/CAT-TDD","commit":"e98a152bdc1ae15990baf1db3fa5bb6618207929","tree":"01bff4586a56733484a9868984b72f9143ad148b","kind":"read-only-source-snapshot"}' > bundle/manifest.json
      - name: Upload immutable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cat20-final-e98a152b
          path: bundle/
          retention-days: 1
