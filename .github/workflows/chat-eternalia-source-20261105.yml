name: Temporary read-only Eternalia source snapshot
on:
  push:
    branches:
      - infra/chat-eternalia-source-20261105
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: b4bb57d0b10c84bd8f50242efceba40db64e4097
          persist-credentials: false
          path: target
      - name: Verify target and archive only tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "b4bb57d0b10c84bd8f50242efceba40db64e4097"
          test "$(git -C target rev-parse HEAD^{tree})" = "2db15a184df021b9285855c42f43ed5cd0878fec"
          mkdir -p artifact
          git -C target archive --format=tar HEAD | gzip -n > artifact/source.tar.gz
          printf '%s\n' 'repository=surumeneco/Eternalia_Novel' 'commit=b4bb57d0b10c84bd8f50242efceba40db64e4097' 'tree=2db15a184df021b9285855c42f43ed5cd0878fec' > artifact/manifest.txt
          sha256sum artifact/source.tar.gz > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: eternalia-source-b4bb57d0
          path: artifact/
          retention-days: 1
          if-no-files-found: error
