<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101d28" />
<meta name="description" content="3つの異なるゲームの面白さを比べる、スマートフォン用プロトタイプ実験室" />
<title>AIGameLabo | Playtest</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<main id="app">
  <header><div class="brand">AIGameLabo <span>PROTOTYPE / 01</span></div><h1>どの遊びが、いちばん面白い？</h1><p class="subtitle">3つの異なる体験を実際に試す、ゲーム実験室。</p></header>
  <nav id="game-tabs" aria-label="ゲーム選択"></nav>
  <section class="game-shell" aria-label="ゲームエリア">
    <div class="game-meta"><div><h2 id="game-title"></h2><p id="game-subtitle"></p></div><button class="ghost" id="reset" type="button">最初から</button></div>
    <div class="objective" id="objective" aria-live="polite"></div>
    <div id="board" aria-label="操作できるゲーム盤面"></div>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="controls" class="controls" aria-label="操作ボタン"></div>
    <div id="help" class="help"></div>
  </section>
  <section class="feedback" aria-label="試遊メモ"><h2>試遊メモ <small>端末内に保存</small></h2><p>ゲームの優劣だけでなく、どの操作が楽しかったかを残してください。</p>
    <label for="score">もう一度遊びたい度合い</label><select id="score"><option value="">未評価</option><option value="1">1 / 遊びたくない</option><option value="2">2 / あまり遊びたくない</option><option value="3">3 / どちらともいえない</option><option value="4">4 / また遊びたい</option><option value="5">5 / とても遊びたい</option></select>
    <label for="note">面白かった操作・不満・改善案</label><textarea id="note" rows="3" placeholder="何をした時に楽しかったか、面倒だったか…"></textarea>
    <div class="feedback-actions"><button id="save-note" type="button">メモを保存</button><button class="ghost" id="export" type="button">結果をJSON保存</button></div><p id="save-state" role="status"></p>
  </section>
  <footer>Phaser 3 · Portrait-first · No account · Local save</footer>
</main>
<script src="./app.js" defer></script>
</body></html>
